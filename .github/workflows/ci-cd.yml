name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feature/*" ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  PYTHON_VERSION: "3.10"
  
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for version detection
        
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wireguard-tools
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch
        pip install -e ".[dev,test]"
        
    - name: Lint with ruff
      run: |
        ruff check src/
        
    - name: Run tests
      run: |
        pytest --cov=wireguard_peer_tool --cov-report=xml tests/
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        
  build-and-publish-test:
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || github.event_name == 'pull_request'
    
    permissions:
      contents: read
      id-token: write  # For trusted publishing
      pull-requests: write  # For PR comments
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch
        
    - name: Inject dev version
      run: python .hooks/sync_version.py --dev
        
    - name: Get clean version
      id: version
      run: |
        VERSION=$(hatch version | cut -d+ -f1)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Clean version: $VERSION"
        
    - name: Check if version exists on Test PyPI
      id: version_check
      env:
        VERSION: ${{ env.VERSION }}
      run: |
        if pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ wireguard-peer-tool==${VERSION} --dry-run; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "⚠️ Version ${VERSION} already exists on Test PyPI"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "✅ Version ${VERSION} is available for upload"
        fi
      continue-on-error: true
        
    - name: Clean previous builds
      if: steps.version_check.outputs.exists != 'true'
      run: rm -rf dist/ build/ *.egg-info
        
    - name: Build package
      if: steps.version_check.outputs.exists != 'true'
      run: hatch build
        
    - name: Publish to Test PyPI
      if: steps.version_check.outputs.exists != 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist/
        verbose: true
        
    - name: Verify package is available
      if: steps.version_check.outputs.exists != 'true'
      id: verify_package
      env:
        VERSION: ${{ env.VERSION }}
      run: |
        for i in {1..30}; do
          if pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ wireguard-peer-tool==${VERSION}; then
            echo "Package ${VERSION} is now available and installable on Test PyPI"
            pip uninstall -y wireguard-peer-tool
            echo "success=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Attempt $i: Package not yet installable, waiting 20s... (${i}/30)"
          sleep 20
        done
        echo "success=false" >> $GITHUB_OUTPUT
        exit 1
        
    - name: Comment on PR with install instructions
      if: github.event_name == 'pull_request' && (steps.version_check.outputs.exists == 'true' || steps.verify_package.outputs.success == 'true')
      uses: actions/github-script@v7
      env:
        VERSION: ${{ env.VERSION }}
      with:
        script: |
          const version = process.env.VERSION;
          const prNumber = context.payload.pull_request.number;
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          
          // Find existing bot comments
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          });

          const botComment = comments.data.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('📦 Test Package Available')
          );

          const installCmd = `pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ wireguard-peer-tool==${version}`;
          
          const body = `## 📦 Test Package Available
          
          A test package has been built for this PR and is available on Test PyPI:
          
          \`\`\`bash
          ${installCmd}
          \`\`\`
          
          **Version:** \`${version}\`
          
          You can test this version before merging. The package will be available at:
          https://test.pypi.org/project/wireguard-peer-tool/${version}/
          
          ---
          *This comment was automatically generated by the CI/CD pipeline.*`;
          
          if (botComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: owner,
              repo: repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: prNumber,
              body: body
            });
          }
          
  build-and-publish-prod:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    permissions:
      contents: write  # For release notes
      id-token: write  # For trusted publishing
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch
        
    - name: Sync version for production
      run: python .hooks/sync_version.py
        
    - name: Get production version
      id: prod_version
      run: |
        # For production, get the clean version after sync
        PACKAGE_VERSION=$(hatch version)
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
        echo "Production version: $PACKAGE_VERSION"
        
    - name: Verify version matches release tag
      run: |
        RELEASE_TAG=${GITHUB_REF#refs/tags/}
        
        if [ "v$PACKAGE_VERSION" != "$RELEASE_TAG" ]; then
          echo "Package version ($PACKAGE_VERSION) does not match release tag ($RELEASE_TAG)"
          exit 1
        fi
        
        echo "✅ Version verified: $PACKAGE_VERSION matches $RELEASE_TAG"
        
    - name: Build package
      run: |
        hatch build
        
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        
    - name: Create GitHub release notes
      uses: actions/github-script@v7
      with:
        script: |
          const packageVersion = '${{ github.event.release.tag_name }}';
          const releaseBody = `## 🚀 Release ${packageVersion}
          
          ### Installation
          
          \`\`\`bash
          pip install --upgrade wireguard-peer-tool
          \`\`\`
          
          ### PyPI Package
          
          📦 **PyPI:** https://pypi.org/project/wireguard-peer-tool/${packageVersion.replace('v', '')}/
          
          ${context.payload.release.body || ''}
          
          ---
          
          ### Changes in this release
          
          See the full changelog at: https://github.com/${{ github.repository }}/compare/${{ github.event.release.target_commitish }}...${packageVersion}
          
          ---
          *This release was automatically published by the CI/CD pipeline.*`;
          
          await github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: context.payload.release.id,
            body: releaseBody
          });

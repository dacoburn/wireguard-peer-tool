name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feature/*" ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  PYTHON_VERSION: "3.10"
  
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for version detection
        
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wireguard-tools
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch
        pip install -e ".[dev,test]"
        
    - name: Lint with ruff
      run: |
        ruff check src/
        
    - name: Run tests
      run: |
        pytest --cov=wireguard_peer_tool --cov-report=xml tests/
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        
  build-and-publish-test:
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || github.event_name == 'pull_request'
    
    permissions:
      contents: read
      id-token: write  # For trusted publishing
      pull-requests: write  # For PR comments
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch
        
    - name: Get version info
      id: version
      run: |
        # For dev builds, use a simple incremental version without VCS info
        BUILD_NUMBER=${GITHUB_RUN_NUMBER}
        
        # Create simple dev version: 0.1.0.dev123
        DEV_VERSION="0.1.0.dev${BUILD_NUMBER}"
        
        echo "dev_version=$DEV_VERSION" >> $GITHUB_OUTPUT
        echo "Generated dev version: $DEV_VERSION"
        
    - name: Update version for dev release
      run: |
        # Update the version file with dev version
        echo "__version__ = \"${{ steps.version.outputs.dev_version }}\"" > src/wireguard_peer_tool/_version.py
        
        # Use SETUPTOOLS_SCM_PRETEND_VERSION to override VCS version detection
        echo "SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.dev_version }}" >> $GITHUB_ENV
        
    - name: Build package
      run: |
        # Build with version override
        hatch build
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.dev_version }}
        
    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist/
        
    - name: Comment on PR with install instructions
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const devVersion = '${{ steps.version.outputs.dev_version }}';
          const installCmd = `pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ wireguard-peer-tool==${devVersion}`;
          
          const body = `## 📦 Test Package Available
          
          A test package has been built for this PR and is available on Test PyPI:
          
          \`\`\`bash
          ${installCmd}
          \`\`\`
          
          **Version:** \`${devVersion}\`
          
          You can test this version before merging. The package will be available at:
          https://test.pypi.org/project/wireguard-peer-tool/${devVersion}/
          
          ---
          *This comment was automatically generated by the CI/CD pipeline.*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
          
  build-and-publish-prod:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    permissions:
      contents: write  # For release notes
      id-token: write  # For trusted publishing
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch
        
    - name: Verify version matches release tag
      run: |
        PACKAGE_VERSION=$(hatch version)
        RELEASE_TAG=${GITHUB_REF#refs/tags/}
        
        if [ "v$PACKAGE_VERSION" != "$RELEASE_TAG" ]; then
          echo "Package version ($PACKAGE_VERSION) does not match release tag ($RELEASE_TAG)"
          exit 1
        fi
        
        echo "Version verified: $PACKAGE_VERSION matches $RELEASE_TAG"
        
    - name: Build package
      run: |
        hatch build
        
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        
    - name: Create GitHub release notes
      uses: actions/github-script@v7
      with:
        script: |
          const packageVersion = '${{ github.event.release.tag_name }}';
          const releaseBody = `## 🚀 Release ${packageVersion}
          
          ### Installation
          
          \`\`\`bash
          pip install --upgrade wireguard-peer-tool
          \`\`\`
          
          ### PyPI Package
          
          📦 **PyPI:** https://pypi.org/project/wireguard-peer-tool/${packageVersion.replace('v', '')}/
          
          ${context.payload.release.body || ''}
          
          ---
          
          ### Changes in this release
          
          See the full changelog at: https://github.com/${{ github.repository }}/compare/${{ github.event.release.target_commitish }}...${packageVersion}
          
          ---
          *This release was automatically published by the CI/CD pipeline.*`;
          
          await github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: context.payload.release.id,
            body: releaseBody
          });

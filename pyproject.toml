[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "wireguard-peer-tool"
dynamic = ["version"]
description = "A modern, secure Python-based command-line tool for managing WireGuard VPN server configurations and peers"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["wireguard", "vpn", "network", "security", "cli"]
authors = [
  { name = "Andrew Coburn", email = "andrew@dacoburn.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=3.4.8",
  "qrcode[pil]>=7.3",
  "pyzipper>=0.3.6",
  "Pillow>=8.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "black",
  "isort",
  "mypy",
  "ruff",
  "pre-commit",
  "types-pillow",
]
test = [
  "pytest>=7.0",
  "pytest-cov",
  "pytest-mock",
]

[project.urls]
Documentation = "https://github.com/dacoburn/wireguard-peer-tool#readme"
Issues = "https://github.com/dacoburn/wireguard-peer-tool/issues"
Source = "https://github.com/dacoburn/wireguard-peer-tool"

[project.scripts]
wireguard-peer-tool = "wireguard_manager.cli:main"
wg-peer-tool = "wireguard_manager.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/wireguard_manager/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/docs",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wireguard_manager"]

[tool.black]
target-version = ["py38"]
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
target-version = "py38"
line-length = 88
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.isort]
known-first-party = ["wireguard_manager"]

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=wireguard_manager",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
]
xfail_strict = true
filterwarnings = [
  "error",
]
log_cli_level = "INFO"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
]
